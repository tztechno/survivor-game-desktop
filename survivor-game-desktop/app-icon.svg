<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="70%" stop-color="#090d1c"/>
      <stop offset="100%" stop-color="#04060e"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0077fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Cyber Grid lines -->
  <path d="M120 512 H904 M512 120 V904 M240 240 L784 784 M240 784 L784 240" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.15"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#9d4edd" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="16 12"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Orbital blades -->
  <g filter="url(#neonGlow)">
    <circle cx="512" cy="232" r="32" fill="#00ff88"/>
    <circle cx="792" cy="512" r="32" fill="#00ff88"/>
    <circle cx="512" cy="792" r="32" fill="#00ff88"/>
    <circle cx="232" cy="512" r="32" fill="#00ff88"/>
  </g>

  <!-- Core Mech Shield (Hexagon / Diamond) -->
  <polygon points="512,200 780,360 780,680 512,840 244,680 244,360" fill="url(#shieldGrad)" filter="url(#neonGlow)" opacity="0.95"/>
  <polygon points="512,260 720,385 720,635 512,760 304,635 304,385" fill="#0b0f20" stroke="#00f0ff" stroke-width="8"/>

  <!-- Glowing EXP Gem Core -->
  <polygon points="512,340 640,512 512,684 384,512" fill="url(#gemGrad)" filter="url(#neonGlow)"/>
  <polygon points="512,410 580,512 512,614 444,512" fill="#ffffff" opacity="0.85"/>

  <!-- Energy sparks -->
  <circle cx="512" cy="512" r="16" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>