name: Build Windows Desktop App (EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (EXE / NSIS / MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'survivor-game-desktop/package.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'survivor-game-desktop/src-tauri -> target'

      - name: Install Dependencies
        working-directory: survivor-game-desktop
        run: npm install

      - name: Build Tauri App for Windows
        working-directory: survivor-game-desktop
        run: npx tauri build

      - name: Verify Built Windows Artifacts
        shell: bash
        run: |
          echo "=== Built Artifacts ==="
          ls -la survivor-game-desktop/src-tauri/target/release/bundle/nsis/ || true
          ls -la survivor-game-desktop/src-tauri/target/release/bundle/msi/ || true

      - name: Upload Windows NSIS Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: CYBER_SURVIVORS_Windows_Setup_EXE
          path: |
            survivor-game-desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload Windows MSI Installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: CYBER_SURVIVORS_Windows_MSI
          path: |
            survivor-game-desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
