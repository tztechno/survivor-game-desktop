name: Release Desktop Apps (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x86_64, macos-arm64, macos-x86_64]
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-x86_64
            os: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'survivor-game-desktop/package.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'survivor-game-desktop/src-tauri -> target'

      - name: Install Dependencies
        working-directory: survivor-game-desktop
        run: npm install

      - name: Build Tauri App
        working-directory: survivor-game-desktop
        run: npx tauri build

      - name: Upload Windows Bundle Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: CYBER_SURVIVORS_Windows_Bundle
          path: |
            survivor-game-desktop/src-tauri/target/release/bundle/nsis/*.exe
            survivor-game-desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS Bundle Artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: CYBER_SURVIVORS_macOS_Bundle_${{ matrix.platform }}
          path: |
            survivor-game-desktop/src-tauri/target/release/bundle/dmg/*.dmg
